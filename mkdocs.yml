site_name: "InstaRoad: Deep Learning Road Network Extraction from Satellite Imagery"
theme:
  name: readthedocs
  navigation_depth: 6

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src, instageo]
          options:
            show_source: false
            show_root_heading: false
            docstring_style: google

nav:
  - Introduction: index.md
  - Setup Guide: setup.md
  - SAM Road: samroad.md
  - Sentinel2: sentinel2.md
  - Change Log: changelog.md
  - API Reference: reference/

