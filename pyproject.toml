[project]
name = "instaroadprototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "mkdocs>=1.6.1",
    "numpy>=1.24.0",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocstrings[python]>=1.0.4",
    "scikit-image>=0.26.0",
]

[project.optional-dependencies]
sentinel2 = [
    "sknw",
    # sknw declares `numba` unpinned. Modern numba caps numpy<2.5, so on a fresh
    # resolve where something else drags numpy to 2.5 the solver backtracks numba
    # all the way to 0.53.1 -> llvmlite 0.36.0, which refuses to build on Python
    # >=3.10 (hard version guard in its setup.py). This floor keeps numba modern
    # and lets numpy settle at 2.4.x instead. Verified on linux and macos/3.12.
    "numba>=0.62",
    "scikit-image",
    "opencv-python",
    "earthengine-api>=1.7.22",
    "geopandas>=1.1.3",
    "rasterio>=1.5.0",
    "shapely>=2.1.2",
    "numpy>=2.4.4",
    "pyarrow>=23.0.1",
    "jenkspy>=0.4.1",
    "pandas>=3.0.2",
    "typer>=0.24.1",
    "rioxarray>=0.22.0",
    "torch>=2.11.0",
    "pyogrio>=0.12.1",
    "pyyaml",               # CLI --config loader (sentinel2data.cli)
]


unet = [
    "segmentation-models-pytorch",
    "albumentations>=2.0.8",
    "lightning>=2.0",
    "torch>=2.1.0",
    "torchvision>=0.25.0",
    "torchmetrics",
    "torchgeo>=0.9.0",      # tiled-dataset loader (unet.geo_dataset)
    "geopandas>=1.1.3",     # torchgeo GeoDataset spatial index
    "rasterio>=1.5.0",
    "pandas>=2.0",
    "pyarrow",
    "kagglehub",
    "wandb",
    "jsonargparse[signatures]>=4.27",   # LightningCLI config/CLI (unet.cli)
    "optuna>=3.6",                      # hyperparameter search (unet.tune)
    "optuna-integration>=3.6",
    "opencv-python",          # PyTorchLightningPruningCallback
]

torchgeo = [
    "torchgeo>=0.9.0",
    "rasterio>=1.5.0",
    "geopandas>=1.1.3",
    "pyarrow",
    "lightning>=2.0",
    "torch>=2.1.0",
    "albumentations",
]

benchmarking = [
    "geopandas",
    "awscli",
    "eotdl",
    "pandas>=2.0",
    "scipy>=1.11",
    "networkx>=3.0",        # apls tile metric (benchmarking.graph_metrics)
    "pyarrow>=14.0",
    "pyyaml",
    "typer>=0.24.1",        # benchmarking.cli
    # `benchmark eval` additionally needs the unet model stack (torch/lightning/smp/rasterio)
    ]


instageo = [
    "instageo[gpu,data,model]",
]
terra = [
    "albumentations>=2.0.8",
    "huggingface-hub",              # hf_hub_download for TerraMind checkpoint
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "segmentation-models-pytorch",  # DiceLoss for binary segmentation
    "terratorch",
    "torch>=2.1.0",
    "torchvision>=0.25.0",
    "wandb",
]

dlinknet = [
    "lightning>=2.0",
    "torchmetrics>=1.0",
]

baseline = [
    "segmentation-models-pytorch",
    "albumentations",
    "rasterio>=1.5.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "wandb",
    "torch>=2.1.0",
    "terratorch",
]

# R0/R1/R2 resolution-enhancement experiments (src/sr): baseline deps + SEN2SR.
sr = [
    "instaroadprototype[baseline]",
    "lightning>=2.0",
    "torchmetrics>=1.0",
    "sen2sr",
    "mlstac",
    "safetensors",
    "mamba-ssm",             # full (Mamba-backbone) SEN2SR; compiles CUDA kernels
]

utilities = [
    "absl-py>=2.4.0",
    "geopandas>=1.1.2",
    "rasterio>=1.5.0",
]

[project.scripts]
unet = "unet.cli:cli_main"   # `unet fit|test|predict --config src/unet/configs/unet.yaml`
benchmark = "benchmarking.cli:cli_main"  # `benchmark eval|compare|variance|report --config src/benchmarking/configs/benchmark.yaml`


[tool.uv.sources]
instageo = { git = "https://github.com/kelviy/InstaGeo-E2E-Geospatial-ML.git" }
terratorch = { git = "https://github.com/terrastackai/terratorch.git" }
# segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }

# Linux/Windows use torch CUDA index. Mac falls back to default PyPI
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",  # Apple Silicon Mac
    "sys_platform == 'win32'",                                    # Windows
    "sys_platform == 'linux'",                                    # Linux
]

# mamba-ssm (and its optional causal-conv1d companion) `import torch` in setup.py
# but don't declare it as a build dependency, so uv's ISOLATED build env lacks
# torch -> "ModuleNotFoundError: No module named 'torch'". Inject it (plus the
# other build-time imports) into their build envs. NOTE: these still COMPILE
# CUDA kernels, so the build node also needs nvcc (`module load cuda`) and enough
# RAM; there is no prebuilt wheel for Python 3.13, so it builds from source.
[tool.uv.extra-build-dependencies]
mamba-ssm = ["torch", "packaging", "setuptools", "wheel", "ninja"]
causal-conv1d = ["torch", "packaging", "setuptools", "wheel", "ninja"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocstrings[python]>=1.0.4",
    "typer>=0.24.1",
]

# This section tells hatchling to look inside 'src' for packages
[tool.hatch.build.targets.wheel]
packages = ["src/samroad", "src/sentinel2data", "src/unet", "src/terramind", "src/benchmarking", "src/sr"]
