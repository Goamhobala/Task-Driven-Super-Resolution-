trainer:
  accelerator: auto
  devices: auto
  logger: false

model:
  class_path: src.utils.lightning_utils.LightningWrapper
  init_args:
    learning_rate: 0.001
    threshold: 0.5
    model:
      class_path: dlinknet.networks.dinknet.DinkNet34
      init_args:
        num_classes: 1
        num_channels: 3


data:
  class_path: sentinel_datamodule.SentinelDataModule
  init_args:
    base_dir: /kaggle/working/InstaRoadPrototype/dataset/S2IndianRegions
    dataset_dir: /kaggle/working/InstaRoadPrototype/dataset/sentinel2/sentinel2_256/15765738
    image_size: 1024
    train_batch_size: 4
    eval_batch_size: 16
    num_workers: 2
    transform:
      class_path: albumentations.Compose
      init_args:
        transforms:
          - class_path: albumentations.Resize
            init_args:
              height: 1024
              width: 1024
          - class_path: albumentations.Normalize
            init_args:
              mean: [0.485, 0.456, 0.406]
              std: [0.229, 0.224, 0.225]

ckpt_path: /kaggle/working/checkpoints/dlinknet34_resnet34.ckpt