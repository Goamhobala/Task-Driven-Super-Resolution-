# Joint SR + UNet road-segmentation config (SEN2SR front-end, two LRs).
# Mirrors unet_upscale.yaml but the upsampling is LEARNED and tuned jointly:
# native 10 m crops -> SEN2SR x4 -> post-SR normalisation -> UNet, trained by
# the segmentation loss alone (task-driven SR; lr_sr << lr is the alpha).
#
#   python -m sr.cli fit  --config src/sr/configs/joint_sr.yaml \
#                         --config src/unet/configs/norm_stats.yaml
#   python -m sr.cli test --config ... --ckpt_path checkpoints/unet_s2rosa_jointsr_best.ckpt
#
# Prefetch SEN2SR weights ONCE on a node with internet (compute nodes have none):
#   python -c "from sr.sen2sr_loader import download_sen2sr; download_sen2sr('<model_dir>')"
#
# `bands`, `image_size`, `normalize`, norm stats live under `data:` only and are
# linked into the model (which applies the normalisation AFTER super-resolution;
# the dataloader feeds raw DN). Do NOT add them under `model:`.
#
# Ablation switches:
#   model.upsampler: bicubic            -> R0 deterministic baseline (lr_sr unused)
#   model.upsampler: sen2sr + freeze_sr: true  -> R1 frozen SR preprocessing
#   model.upsampler: sen2sr + freeze_sr: false -> R2 joint task-driven SR (default)
#   data.mask_source: graph|raster      -> CDNGI (pipeline) vs OSM HR labels

seed_everything: 42

trainer:
  max_epochs: 20
  accelerator: auto
  devices: auto
  # One numerical regime everywhere: matches sr.tune's search default. Applies
  # to the UNet stage only -- the SR nets always run in an fp32 island (their
  # FFT constraint has no bf16 kernels; see JointSRUNetLightning.forward).
  # Pre-Ampere GPUs have no bf16: override with --trainer.precision 16-mixed.
  precision: bf16-mixed
  # Recipe v2: clip exploding steps (global L2 norm, both LR groups jointly).
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  logger: true
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints
        filename: unet_s2rosa_jointsr_best
        monitor: val_iou
        mode: max
        save_top_k: 1
        save_last: true
    # Stop once val_iou plateaus so the refit doesn't burn the whole SLURM
    # wall-clock (which was killing the job before the test stage ran).
    # max_epochs is now an UPPER bound; raise patience if val_iou is still noisy.
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_iou
        mode: max
        patience: 10
        min_delta: 0.0
        verbose: true

model:
  encoder_name: resnet34
  encoder_weights: imagenet
  classes: 1
  lr: 1.0e-4                  # UNet LR (baseline convention)
  lr_sr: 1.0e-5               # SEN2SR LR; keep well below lr (alpha = lr_sr/lr).
                              # Starting point only — search both with sr.tune.
  # ---- recipe v2 training dynamics ----------------------------------------
  lr_schedule: cosine         # per-step cosine of BOTH groups to 0 over the
                              # run's max_epochs (alpha constant; T_max is the
                              # trainer's own budget, so tune trials and refits
                              # each run a COMPLETE schedule). "none" = legacy.
  sr_warmup_epochs: 1.0       # linear ramp on the SR group's lr only (LP-FT:
                              # skip the random-decoder noise phase; absolute,
                              # not scaled to budget). AUTO-OFF in the model
                              # for frozen/bicubic SR and staged warm starts
                              # (warm_start_unet: stage-1 IS the warmup).
  l2sp_lambda: 0.0            # optional L2-SP anchor l2sp_lambda*sum||th-th0||^2
                              # toward the PRETRAINED SR weights (Li et al.
                              # 2018). 0 = pure task-driven SR (TDSR-DET);
                              # escalate only on sr_drift_rel evidence.
  # ---- adaptive post-SR normalisation (docs/adaptive_norm_plan.md) --------
  # The z-score below the SR net uses FROZEN dataset stats, valid only while
  # the SR output distribution stays put. SEN2SR's FFT HardConstraint pins each
  # band's DC term to the bicubic input so it barely moves; SR4RS has no anchor
  # and can wander freely under task-only fine-tuning. Both flags default OFF:
  # every existing arm and benchmark row stays bit-for-bit comparable.
  adaptive_norm: false        # per-batch EMA of the post-SR moments on
                              # STOP-GRAD buffers, used in training as well as
                              # eval — i.e. permanently on BatchNorm's
                              # INFERENCE path, never batch-stats-in-forward
                              # (that would backprop through the statistics).
                              # No learnable gamma/beta: the UNet's first conv
                              # absorbs any per-band affine itself.
  adaptive_norm_momentum: 0.01   # new = (1-m)*old + m*batch; horizon ~1/m
                              # steps. PINNED, never searched — it is also the
                              # only loss-side restoring force against SR drift
                              # (a perfect tracker makes the task loss exactly
                              # affine-invariant). Diagnose with adapt_lag_max.
  adaptive_norm_warmup_steps: 0  # delay the EMA (e.g. past the SR LR ramp)
  adaptive_norm_check_every: 50  # steps between std-band checks (1 host
                              # sync each, so not every step). 0 disables the
                              # guard entirely — tests only, never a run.
  # Std band, as multiples of the run's STARTING std. ASYMMETRIC on purpose:
  #   collapse is the catastrophe — gain into the generator is rs/band_std, so
  #     lower std -> higher gain -> faster drift. Positive feedback. Tight.
  #   growth is self-stabilising — rising std LOWERS the gain — and some
  #     contrast growth is what task-driven SR is for. Its real risk (output
  #     stops resembling imagery) is sr_psnr_vs_init's job, not a moment's.
  std_band_action: warn       # warn | raise. WARN IS THE DEFAULT AND MUST STAY
                              # THAT WAY for fits: measuring what the task loss
                              # does to the SR generator IS the R2/R4
                              # experiment, so a band exit is a RESULT, logged
                              # as adapt_band_exit=1, not a fault. On
                              # 2026-08-19 a `raise` default killed r4b_new at
                              # epoch 13/100 (a day of queueing) at lr_sr 13x
                              # BELOW the design default, on a decelerating
                              # trend that crossed the bound by 0.004.
                              # `raise` is for sr.tune only, where a short
                              # trial hitting the band is a verdict on that
                              # corner and pruning saves budget.
  std_band_raise_lo: 0.5
  std_band_raise_hi: 4.0
  std_band_warn_lo: 0.7
  std_band_warn_hi: 1.5
  norm_recalibrate: "off"     # off | pre | post | auto — exact PreciseBN-style
                              # (QUOTED: bare `off` is boolean False in YAML)
                              # recompute of the post-SR stats over
                              # norm_recalibrate_batches train batches.
                              #   pre  = before fitting. The COMPLETE fix for
                              #          frozen-SR arms (r1/r5): stationary
                              #          output stats, adapter otherwise stale
                              #          from step 0.
                              #   post = at end of training; last.ckpt (and an
                              #          UNMONITORED _final.ckpt) are then
                              #          REWRITTEN so they carry population
                              #          stats. A monitored _best.ckpt keeps
                              #          its own epoch's stats by design.
                              #   auto = pre if SR frozen, post if
                              #          adaptive_norm, off for bicubic.
  norm_recalibrate_batches: 200
  sr_functional_monitor: true # PSNR/RMSE of the CURRENT SR output vs the
                              # INITIAL net's output on one fixed batch. No
                              # ground truth involved — a drift distance, not a
                              # quality score, and the only monitor that can
                              # see the SR restructuring content at fixed
                              # mean/std. Numerically inert; auto-skipped when
                              # the SR net has no trainable params.
  sr_monitor_samples: 2
  pos_weight: 5.0
  threshold: 0.5
  upsampler: sen2sr           # sen2sr (Lite/CNN) | sen2sr_full (Mamba; needs
                              # mamba_ssm + its own sen2sr_dir) | bicubic
  freeze_sr: false            # true -> R1 (frozen SR preprocessing)
  sr_pad: 0                   # reflect-pad (native px) around the SR stage; output
                              # cropped back. Mitigates the FFT border artifact
                              # (try 8). Ckpts are pad-specific (mask buffer resizes).
  reflectance_scale: 1.0      # raw-COG -> 0-1 reflectance divisor. The ROSA V2
                              # COGs ALREADY store 0-1 reflectance -> 1.0.
                              # (10000.0 only for DN-valued datasets. The old
                              # default silently starved the SR nets with ~1e-5
                              # inputs; R0 was unaffected, R1-R4 were not.)
  sen2sr_dir: /scratch/CHANGE_ME/InstaRoad/models/SEN2SRLite_RGBN

data:
  dataset_dir: /scratch/CHANGE_ME/InstaRoad/ROSA_Dense_CDNGI
  bands: [1, 2, 3, 4]         # SEN2SR REQUIRES raw [B4,B3,B2,B8]; never 21-23 here
  batch_size: 4               # 512px UNet stage is memory-heavy
  num_workers: 2
  crop_size: 128              # pinned to 128 by SEN2SR's shipped FFT mask
  upscale: 4                  # -> model output & masks at crop_size*4 = 512 (2.5 m)
  image_size: 256             # vestigial; keeps the shared CLI link resolvable
  mask_source: graph          # graph = pipeline labels (CDNGI); raster = OSM HR masks
  mask_dirname: mask_osm_2pt5   # used when mask_source: raster
  min_road_density: 0.0       # keep ALL train tiles. Sparse-tile balance is the
                              # generator's job (empty_keep_ratio), and filtering
                              # here (a) diverges from the plain unet baseline,
                              # which has no such filter, and (b) removes the
                              # sparse RURAL tiles the project targets. (0.05 was
                              # inherited from unet_upscale.yaml — friend's knob.)
  length: null
  normalize: true             # applied INSIDE the model, after SR
  # Frozen per-band train stats (FULL stack, 1-based) — layer norm_stats.yaml:
  #   python -m sentinel2data.cli norm-stats --dataset-dir <root> --out src/unet/configs/norm_stats.yaml
  norm_mean: null
  norm_std: null
