# Raw RGB + NIR variant (bands 1,2,3,4 -> 4 input channels). Self-contained:
# use INSTEAD of unet.yaml, not alongside it (trainer.callbacks lists would append).
#
#   python -m unet.cli fit     --config src/unet/configs/normal_rgb_nir.yaml
#   python -m unet.cli predict --config src/unet/configs/normal_rgb_nir.yaml \
#       --ckpt_path checkpoints/normal_rgb_nir/unet_s2rosa_best.ckpt --return_predictions false

seed_everything: 42

trainer:
  max_epochs: 20
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  logger: true
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/normal_rgb_nir
        filename: unet_s2rosa_best
        monitor: val_iou
        mode: max
        save_top_k: 1
        save_last: true
    - class_path: unet.writer.ZonePredictionWriter
      init_args:
        output_dir: predictions/normal_rgb_nir
        threshold: 0.5
        write_cog: true
        write_png: true
        compute_metrics: true

model:
  encoder_name: resnet34
  encoder_weights: imagenet
  classes: 1
  lr: 1.0e-4
  pos_weight: 5.0
  val_overlap: 128
  threshold: 0.5

data:
  dataset_dir: /kaggle/working/InstaRoadPrototype/dataset/s2rosa/S2ROSA
  bands: [1, 2, 3, 4]         # B4, B3, B2, B8 (RGB + NIR)
  batch_size: 16
  num_workers: 2
  image_size: 256
  length: null
  normalize: true
  norm_mean: null   # full 23-band frozen train stats; see compute_norm_stats / unet.yaml
  norm_std: null
  predict_split: test
  zones: null
  max_zones: null
