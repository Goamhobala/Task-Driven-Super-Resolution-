# Canonical UNet road-segmentation config (enhanced-RGB bands 21,22,23).
# Drives every subcommand of `python -m unet.cli {fit,validate,test,predict}`.
#
#   fit     -> train; checkpoints on the stitched val_iou.
#   test    -> whole-zone stitched IoU/F1 (model.test_step).
#   predict -> per-zone COG + comparison PNG + global metrics (ZonePredictionWriter).
#
# `bands`, `image_size`, `normalize` live under `data:` only and are linked into the
# model (`in_channels = len(bands)`); do NOT add them under `model:`.

seed_everything: 42

trainer:
  max_epochs: 20
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  # Default logger. For Weights & Biases, also pass `--config src/unet/configs/wandb.yaml`.
  logger: true
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints
        filename: unet_s2rosa_best
        monitor: val_iou
        mode: max
        save_top_k: 1
        save_last: true
    # Inert during fit/validate/test; writes outputs only on `predict`.
    - class_path: unet.writer.ZonePredictionWriter
      init_args:
        output_dir: predictions
        threshold: 0.5
        write_cog: true
        write_png: true
        compute_metrics: true

model:
  encoder_name: resnet34
  encoder_weights: imagenet   # null -> random init
  classes: 1
  lr: 1.0e-4
  pos_weight: 5.0             # weighted-BCE weight on the sparse road class
  val_overlap: 128           # val/test/predict sliding-window overlap (px); 0 = none
  threshold: 0.5

data:
  dataset_dir: /kaggle/working/InstaRoadPrototype/dataset/s2rosa/S2ROSA
  bands: [21, 22, 23]         # enhanced RGB; raw RGB+NIR = [1, 2, 3, 4]
  batch_size: 16
  num_workers: 2
  image_size: 256
  length: null                # train patches/epoch (default 10 * n_train_tiles)
  normalize: true
  # Frozen per-band train-set stats (FULL band stack, 1-based order); sliced to `bands`
  # at apply time and reused for val/test/predict (no leakage). null -> per-image
  # standardisation. Generate + merge:
  #   python -m sentinel2data.cli norm-stats --dataset-dir <root> --out src/unet/configs/norm_stats.yaml
  #   python -m unet.cli fit --config src/unet/configs/unet.yaml --config src/unet/configs/norm_stats.yaml
  norm_mean: null
  norm_std: null
  predict_split: test         # split the `predict` subcommand stitches
  zones: null                 # e.g. ["zone_a", "zone_b"] -> only these zone_name prefixes
  max_zones: null
