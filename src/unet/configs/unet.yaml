# Canonical UNet road-segmentation config (enhanced-RGB bands 21,22,23).
# Drives `python -m unet.cli {fit,validate,test}`.
#
#   fit  -> train; checkpoints on val_iou.
#   test -> per-crop IoU/F1 over the test tiles (model.test_step).
#
# `bands`, `image_size`, `normalize` live under `data:` only and are linked into the
# model (`in_channels = len(bands)`); do NOT add them under `model:`.

seed_everything: 42

trainer:
  max_epochs: 20
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  # Default logger. For Weights & Biases, also pass `--config src/unet/configs/wandb.yaml`.
  logger: true
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints
        filename: unet_s2rosa_best
        monitor: val_iou
        mode: max
        save_top_k: 1
        save_last: true

model:
  encoder_name: resnet34
  encoder_weights: imagenet   # null -> random init
  classes: 1
  lr: 1.0e-4
  pos_weight: 5.0             # weighted-BCE weight on the sparse road class
  threshold: 0.5

data:
  dataset_dir: /kaggle/input/datasets/kelvinwei/s2rosa-v2/S2ROSA_V2
  bands: [21, 22, 23, 4]         # enhanced RGB; raw RGB+NIR = [1, 2, 3, 4]
  mask_dirname: null             # null -> CSVs' masks_raster (CDNGI); set
                                 # masks_osm_10m for OSM labels (see osm_labels.yaml)
  batch_size: 16
  num_workers: 2
  image_size: 256
  length: null                # train patches/epoch (default 10 * n_train_tiles)
  normalize: true
  # Frozen per-band train-set stats (FULL band stack, 1-based order); sliced to `bands`
  # at apply time and reused for val/test (no leakage). null -> per-image
  # standardisation. Generate + merge:
  #   python -m sentinel2data.cli norm-stats --dataset-dir <root> --out src/unet/configs/norm_stats.yaml
  #   python -m unet.cli fit --config src/unet/configs/unet.yaml --config src/unet/configs/norm_stats.yaml
  norm_mean: null
  norm_std: null
